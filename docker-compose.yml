services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carbonbox
      POSTGRES_USER: carbonbox
      POSTGRES_PASSWORD: carbonbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonbox -d carbonbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/carbonbox
      DB_USER: carbonbox
      DB_PASSWORD: carbonbox
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
